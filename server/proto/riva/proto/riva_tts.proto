// Riva gRPC API definitions, regenerated from the descriptors shipped in the
// nvidia-riva-client 2.27.0 Python package (https://pypi.org/project/nvidia-riva-client/).
// Comments from the upstream .proto files are not included.

syntax = "proto3";

package nvidia.riva.tts;

import "riva/proto/riva_audio.proto";
import "riva/proto/riva_common.proto";

service RivaSpeechSynthesis {
  rpc Synthesize(.nvidia.riva.tts.SynthesizeSpeechRequest) returns (.nvidia.riva.tts.SynthesizeSpeechResponse) {}
  rpc SynthesizeOnline(stream .nvidia.riva.tts.SynthesizeSpeechRequest) returns (stream .nvidia.riva.tts.SynthesizeSpeechResponse) {}
  rpc GetRivaSynthesisConfig(.nvidia.riva.tts.RivaSynthesisConfigRequest) returns (.nvidia.riva.tts.RivaSynthesisConfigResponse) {}
}

message RivaSynthesisConfigRequest {
  string model_name = 1;
}

message RivaSynthesisConfigResponse {
  message Config {
    string model_name = 1;
    map<string, string> parameters = 2;
  }
  repeated .nvidia.riva.tts.RivaSynthesisConfigResponse.Config model_config = 1;
}

message ZeroShotData {
  bytes audio_prompt = 1;
  int32 sample_rate_hz = 2;
  .nvidia.riva.AudioEncoding encoding = 3;
  int32 quality = 4;
  string transcript = 5;
}

message SynthesizeSpeechRequest {
  string text = 1;
  string language_code = 2;
  .nvidia.riva.AudioEncoding encoding = 3;
  int32 sample_rate_hz = 4;
  string voice_name = 5;
  .nvidia.riva.tts.ZeroShotData zero_shot_data = 6;
  string custom_dictionary = 7;
  map<string, string> custom_configuration = 8;
  bool enable_word_time_offsets = 9;
  .nvidia.riva.RequestId id = 100;
}

message WordTiming {
  string word = 1;
  int32 start_time = 2;
  int32 end_time = 3;
}

message SynthesizeSpeechResponseMetadata {
  string text = 1;
  string processed_text = 2;
  repeated float predicted_durations = 8;
  repeated .nvidia.riva.tts.WordTiming words = 9;
}

message SynthesizeSpeechResponse {
  bytes audio = 1;
  .nvidia.riva.tts.SynthesizeSpeechResponseMetadata meta = 2;
  .nvidia.riva.RequestId id = 100;
}
